<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capability 11 — Enterprise Reporting Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --surface: #141c2f;
      --surface-2: #1b2740;
      --border: #2a3855;
      --text: #edf2ff;
      --muted: #8ea0c0;
      --accent: #5b8cff;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #172038 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 28, 47, 0.92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.05rem; font-weight: 600; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 0.55rem 0.8rem;
      font-size: 0.85rem;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border-color: transparent;
      color: white;
      font-weight: 500;
    }

    button:hover { filter: brightness(1.08); }

    .nav-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.82rem;
      flex-wrap: wrap;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 1100px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .grid-4 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-body { padding: 1rem; }

    .kpi {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .kpi-label {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .kpi.good { color: var(--success); }
    .kpi.warn { color: var(--warning); }
    .kpi.bad { color: var(--danger); }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(42, 56, 85, 0.55);
      font-size: 0.88rem;
    }

    .metric-row:last-child { border-bottom: none; }

    .bar-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.45rem;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #7aa2ff);
    }

    .bar-fill.success { background: linear-gradient(90deg, #059669, var(--success)); }
    .bar-fill.warning { background: linear-gradient(90deg, #d97706, var(--warning)); }
    .bar-fill.danger { background: linear-gradient(90deg, #dc2626, var(--danger)); }

    .tag-list { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }

    .tag {
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .notes {
      padding: 0.85rem 1rem;
      background: rgba(91, 140, 255, 0.08);
      border: 1px solid rgba(91, 140, 255, 0.25);
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .empty, .error {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
    }

    .error { color: var(--danger); }

    .loading { opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Capability 11 — Enterprise Data Warehouse &amp; Reporting</h1>
      <p>Real-time balanced scorecard from the PostgreSQL audit ledger</p>
    </div>
    <div class="header-actions">
      <a class="nav-link" href="/">← Case workflow</a>
      <select id="lookbackDays">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>

  <main id="dashboard" class="loading">
    <div class="meta-bar">
      <span id="generatedAt">Loading scorecard…</span>
      <span id="eventCount"></span>
    </div>

    <section class="grid-4" id="kpiCards"></section>

    <section class="grid-2">
      <article class="card">
        <div class="card-header">Operational Cycle Times</div>
        <div class="card-body" id="cycleTimesPanel"></div>
      </article>

      <article class="card">
        <div class="card-header">Approval / Denial Ratios</div>
        <div class="card-body" id="approvalPanel"></div>
      </article>
    </section>

    <section class="grid-2">
      <article class="card">
        <div class="card-header">Audit Exception Rates</div>
        <div class="card-body" id="exceptionPanel"></div>
      </article>

      <article class="card">
        <div class="card-header">Model &amp; Capability Tracking</div>
        <div class="card-body" id="modelPanel"></div>
      </article>
    </section>

    <section class="notes" id="notesPanel"></section>
  </main>

  <script>
    const API = "/api/v1/capabilities/11/reporting/scorecard";
    const $ = (id) => document.getElementById(id);

    function fmtHours(value) {
      if (value == null) return "—";
      if (value < 1) return `${Math.round(value * 60)} min`;
      return `${value.toFixed(1)} hr`;
    }

    function fmtPct(value) {
      if (value == null) return "—";
      return `${(value * 100).toFixed(1)}%`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function bar(label, value, max, tone = "") {
      const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
      return `
        <div style="margin-bottom:0.85rem">
          <div class="metric-row">
            <span>${escapeHtml(label)}</span>
            <strong>${escapeHtml(String(value))}</strong>
          </div>
          <div class="bar-track"><div class="bar-fill ${tone}" style="width:${pct}%"></div></div>
        </div>`;
    }

    function renderScorecard(data) {
      const cycle = data.cycle_times;
      const approval = data.approval_denial;
      const exceptions = data.audit_exceptions;
      const model = data.model_tracking;

      $("generatedAt").textContent = `Generated ${new Date(data.generated_at).toLocaleString()} · lookback ${data.lookback_days} days`;
      $("eventCount").textContent = `${exceptions.total_events} audit event(s) analyzed`;

      const exceptionClass = (exceptions.exception_rate || 0) > 0.15 ? "bad" : (exceptions.exception_rate || 0) > 0.05 ? "warn" : "good";
      const approvalClass = (approval.approval_ratio || 0) >= 0.7 ? "good" : (approval.approval_ratio || 0) >= 0.5 ? "warn" : "bad";

      $("kpiCards").innerHTML = `
        <article class="card"><div class="card-body">
          <div class="kpi">${fmtHours(cycle.avg_total_cycle_hours)}</div>
          <div class="kpi-label">Avg total case cycle</div>
        </div></article>
        <article class="card"><div class="card-body">
          <div class="kpi ${approvalClass}">${fmtPct(approval.approval_ratio)}</div>
          <div class="kpi-label">Approval ratio (${approval.approved_count}/${approval.approved_count + approval.denied_count || 0})</div>
        </div></article>
        <article class="card"><div class="card-body">
          <div class="kpi ${exceptionClass}">${fmtPct(exceptions.exception_rate)}</div>
          <div class="kpi-label">${exceptions.exception_count} audit exception(s)</div>
        </div></article>
        <article class="card"><div class="card-body">
          <div class="kpi">${model.ai_review_count}</div>
          <div class="kpi-label">AI / LangGraph reviews tracked</div>
        </div></article>`;

      $("cycleTimesPanel").innerHTML = `
        <div class="metric-row"><span>Pending → AI Review</span><strong>${fmtHours(cycle.avg_pending_to_ai_review_hours)}</strong></div>
        <div class="metric-row"><span>AI review execution</span><strong>${fmtHours(cycle.avg_ai_review_hours)}</strong></div>
        <div class="metric-row"><span>Pending approval queue</span><strong>${fmtHours(cycle.avg_pending_approval_hours)}</strong></div>
        <div class="metric-row"><span>Completed workflows sampled</span><strong>${cycle.sample_size}</strong></div>`;

      const totalDecisions = approval.approved_count + approval.denied_count;
      $("approvalPanel").innerHTML = `
        ${bar("Approved", approval.approved_count, totalDecisions || 1, "success")}
        ${bar("Denied", approval.denied_count, totalDecisions || 1, "danger")}
        <div class="metric-row"><span>Denial ratio</span><strong>${fmtPct(approval.denial_ratio)}</strong></div>`;

      const categories = Object.entries(exceptions.by_category || {});
      $("exceptionPanel").innerHTML = categories.length
        ? categories.map(([key, count]) => bar(key.replaceAll("_", " "), count, exceptions.exception_count || 1, "warning")).join("")
        : `<div class="empty">No categorized exceptions in this window</div>`;
      $("exceptionPanel").innerHTML += `
        <div class="metric-row"><span>Overall exception rate</span><strong>${fmtPct(exceptions.exception_rate)}</strong></div>`;

      const modeTags = Object.entries(model.reviews_by_mode || {})
        .map(([mode, count]) => `<span class="tag">${escapeHtml(mode)}: ${count}</span>`)
        .join("");
      const capabilityTags = Object.entries(model.capability_invocations || {})
        .map(([action, count]) => `<span class="tag">${escapeHtml(action)}: ${count}</span>`)
        .join("");
      const topActions = (model.top_actions || [])
        .map((row) => `<div class="metric-row"><span>${escapeHtml(row.action)}</span><strong>${row.count}</strong></div>`)
        .join("");

      $("modelPanel").innerHTML = `
        <div class="metric-row"><span>AI reviews</span><strong>${model.ai_review_count}</strong></div>
        <div class="tag-list">${modeTags || '<span class="tag">No AI reviews yet</span>'}</div>
        <div style="margin-top:1rem;color:var(--muted);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em">Capability invocations</div>
        <div class="tag-list">${capabilityTags || '<span class="tag">No capability events</span>'}</div>
        <div style="margin-top:1rem;color:var(--muted);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em">Top audit actions</div>
        ${topActions || '<div class="empty">No actions recorded</div>'}`;

      $("notesPanel").textContent = (data.validation_notes || []).join(" · ") || "Scorecard generated from live audit ledger.";
    }

    async function loadScorecard() {
      $("dashboard").classList.add("loading");
      try {
        const lookback = $("lookbackDays").value;
        const res = await fetch(`${API}?lookback_days=${lookback}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to load scorecard");
        renderScorecard(data);
      } catch (err) {
        $("kpiCards").innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        $("notesPanel").textContent = "Unable to load scorecard. Ensure PostgreSQL audit storage is running.";
      } finally {
        $("dashboard").classList.remove("loading");
      }
    }

    $("refreshBtn").addEventListener("click", loadScorecard);
    $("lookbackDays").addEventListener("change", loadScorecard);
    loadScorecard();
    setInterval(loadScorecard, 30000);
  </script>
</body>
</html>
