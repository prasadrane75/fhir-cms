# Deploy on greyflow-app (production-style).
# Postgres: rulescube-postgres on greyflow-db (remote).
# API port 8001 — greyflow-backend already uses 8000.

services:
  api:
    image: ${FHIR_CMS_IMAGE:-fhir-cms-api:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: fhir-cms-api
    ports:
      - "${FHIR_CMS_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      LLM_BASE_URL: ${LLM_BASE_URL:-http://greyflow-ai:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo:latest}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-in-production}
      WEBHOOK_CLINICAL_QUERY: ${WEBHOOK_CLINICAL_QUERY:-Review the latest observation in context and recommend whether care management should proceed.}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-true}
      WEBHOOK_PUBLIC_BASE_URL: ${WEBHOOK_PUBLIC_BASE_URL:-http://127.0.0.1:8001}
    extra_hosts:
      - "greyflow-ai:${GREYFLOW_AI_HOST_IP:-100.124.13.39}"
      - "greyflow-db:${GREYFLOW_DB_HOST_IP:-100.96.75.123}"
    depends_on:
      neo4j:
        condition: service_healthy
      hapi-fhir:
        condition: service_started
    restart: unless-stopped
    networks:
      - fhir-cms

  neo4j:
    image: neo4j:5-community
    container_name: fhir-cms-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - ./init-scripts/neo4j:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - fhir-cms

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: fhir-cms-hapi
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/opt/hapi-extra/"
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      HAPI_FHIR_SUBSCRIPTION_IMMEDIATELY_QUEUED: "true"
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_cascading_deletes: "true"
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.subscription.resthook_enabled: "true"
      hapi.fhir.subscription.immediately_queued: "true"
    volumes:
      - ./config/hapi:/opt/hapi-extra:ro
    restart: unless-stopped
    networks:
      - fhir-cms

networks:
  fhir-cms:
    driver: bridge

volumes:
  neo4j_data:
